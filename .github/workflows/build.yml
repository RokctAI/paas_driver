name: Build (Smart)

permissions: write-all

# A newer push to the same branch supersedes the in-flight CI run — cancel it
# instead of queueing a full pipeline per intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build Type (apk/appbundle) - Ignored for Node'
        required: true
        default: 'apk'
        type: choice
        options:
        - apk
        - appbundle
      flutter-version:
        type: string
        default: '3.38.5'

jobs:
  # --- 1. DETECT PROJECT TYPE ---
  detect:
    runs-on: ubuntu-latest
    outputs:
      is_flutter: ${{ steps.check.outputs.is_flutter }}
      is_node: ${{ steps.check.outputs.is_node }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Project Type
        id: check
        run: |
          if [ -f "pubspec.yaml" ]; then
             echo "Flutter project detected."
             echo "is_flutter=true" >> "$GITHUB_OUTPUT"
             echo "is_node=false" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
             echo "Node.js project detected."
             echo "is_flutter=false" >> "$GITHUB_OUTPUT"
             echo "is_node=true" >> "$GITHUB_OUTPUT"
          else
             echo "Unknown project type. Skipping builds."
             echo "is_flutter=false" >> "$GITHUB_OUTPUT"
             echo "is_node=false" >> "$GITHUB_OUTPUT"
          fi

  # --- 2. UNIFIED PIPELINE (Smart) ---
  pipeline:
    needs: detect
    uses: RokctAI/shared-workflows/.github/workflows/universal-pipeline.yml@3d7610a646cc9e6e8b1e5837f2e5fa2acbaaef3d # shared-workflows main (build_hms input + guided-tour/store-listing lanes)
    with:
      project_type: ${{ needs.detect.outputs.is_flutter == 'true' && 'flutter' || (needs.detect.outputs.is_node == 'true' && 'node' || 'frappe') }}
      # Quality Gate Toggles
      run_security: true
      # Skip lint on pushes to main only: Code Quality (linter.yml) runs the identical
      # lint job on the same SHA there. Every other event/branch keeps linting here.
      run_lint: ${{ github.event_name != 'push' || github.ref_name != 'main' }}
      run_ci: true
      # Deployment Configuration: immediate strategy — main/develop pushes cut a
      # release right away (pre-dedupe behavior). build_* pushes and scheduled
      # promotion stay on the weekly strategy via release.yml.
      release_strategy: 'immediate'
      # RC Cleanup: Delete RC releases/tags after promotion to stable
      cleanup_rc_releases: true
      # One-time cleanup: run cleanup once if past this date (marker file prevents re-runs)
      one_time_cleanup_cutoff_date: '2026-01-30'
      # Brain Endpoint (AI release notes)
      brain_endpoint: https://platform.rokct.ai/api/v1/method/rokct.platform.api
      build_android: true
      # TEMPORARY (desktop test wave for Ray) - revert candidate. Build Windows desktop
      # app and attach it to releases (windows/ scaffolding is installed by desktop_sdk
      # at compose time and committed back like android/ etc.)
      build_windows: true
      # Opt into Huawei Mobile Services wiring (hms_sdk in composer.json). Gracefully
      # skips to a GMS-only build until agconnect-services.json exists in Occultation.
      build_hms: true
      # Pin to 3.38.5 (Dart 3.10+) so processing_sdk's SDK constraint resolves
      flutter-version: ${{ inputs.flutter-version || '3.38.5' }}
      app-type: 'driver'
    secrets: inherit
