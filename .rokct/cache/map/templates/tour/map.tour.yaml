# Guided-tour fragment for map_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `map` (fragment file names must be unique across composed SDKs) and
# documents why there are no steps, so the merge's "SDK has not adopted
# guided tours" warning does not hide a real decision.
#
# map_sdk is a headless mapping layer: manifest.json installs only assets
# and declares no routes, so there is no screen a tour step could ever
# capture. Maps render inside the screens of the SDKs that embed them
# (e.g. delivery_sdk's courier home, zones_sdk's zone editor), which own
# their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: map
steps: []
