# Guided-tour fragment for zones_sdk (driver-role screens).
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns the one driver-visible
# surface zones_sdk installs into a driver compose (manifest.json
# app_type.driver): the /delivery-zone editor
# (DriverDeliveryZoneRoute, reached from the courier profile in normal use).
# zones_sdk's manager flavour ships a merchant catchment editor too, but no
# manager shell tours it yet — this fragment stays driver-only until one does.
#
# Assumes a signed-in deliveryman session: the app manifest signs in through
# auth_sdk's fragment and runs delivery_sdk's fragment first (its last step
# lands on /profile, the screen this editor is normally opened from). In demo
# builds (--dart-define=IS_DEMO=true) DemoDriverDeliveryZonesRepository draws
# the same fictional zone square the courier home map shows, so the editor
# opens on a visible polygon.
#
# The step routes first (no still), then waits (up to 45s) for the page's
# map-ready marker plus a short tile fill before the still - the same wait
# delivery_sdk's driver_home step uses (zones#153). Tour 1114 captured this
# page while the tiles were still grey. Map TILES need network in the
# capture emulator; if they never come the wait times out and the still is
# taken anyway.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: zones
steps:
  - key: driver_delivery_zone_open
    title: "Draw where you deliver"
    action: route
    route: /delivery-zone
    screenshot: false
    settle: 2
  - key: driver_delivery_zone
    title: "Draw where you deliver"
    caption: "Your delivery zone on the map - *redraw the outline* whenever your patch changes, and dispatch follows."
    action: dart
    screenshot: true
    settle: 2
    dart: |
      // Up to 45s for the page's map-ready marker, polled every half
      // second. DriverDeliveryZonePage renders an empty SizedBox keyed
      // 'driver_delivery_zone_map_ready' once GoogleMap's onMapCreated has
      // fired AND the map has gone idle on its first camera position.
      // Matched by key string: no import needed.
      final Finder mapReady = find
          .byKey(const ValueKey<String>('driver_delivery_zone_map_ready'));
      bool ready = false;
      for (int i = 0; i < 90; i++) {
        await tester.pump();
        if (mapReady.evaluate().isNotEmpty) {
          ready = true;
          break;
        }
        await Future<void>.delayed(const Duration(milliseconds: 500));
      }
      // Then 4s more for the tiles to download and fill the map area
      // (first idle can land while tiles are still streaming in).
      if (ready) {
        for (int i = 0; i < 8; i++) {
          await tester.pump();
          await Future<void>.delayed(const Duration(milliseconds: 500));
        }
      }
      await tester.pump();
