# Guided-tour fragment for weather_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `weather` (fragment file names must be unique across composed SDKs)
# and documents why there are no steps, so the merge's "SDK has not adopted
# guided tours" warning does not hide a real decision.
#
# weather_sdk is a headless weather layer with one embeddable component:
# manifest.json installs a host wiring template (AppWeatherWidget +
# configureWeatherSdk startup hook) and declares no routes, so there is no
# screen a tour step could ever capture. The weather widget appears inside
# the embedding SDKs' screens, which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: weather
steps: []
