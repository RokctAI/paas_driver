# Guided-tour fragment for delivery_sdk (driver-role screens).
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns only the screens
# delivery_sdk installs into a driver compose (manifest.json app_type.driver
# routes) - the same SDK whose Demo* courier repositories
# (DemoCourierOrdersRepository / DemoCourierParcelRepository /
# DemoCourierRepository / DemoCourierRouteRepository, seeded from
# DemoDeliverySeed) populate these screens in demo builds
# (--dart-define=IS_DEMO=true).
#
# Assumes a signed-in deliveryman session (the driver session_policy lands
# the role on /home): the app manifest signs in through auth_sdk's fragment
# before running this one. Auth screens are auth_sdk's fragment, not ours.
#
# The home step captures the courier map. It waits (up to 45s) for the
# home's map-ready marker plus a short tile fill before the still. Map TILES
# need network in the capture emulator; if they never come the wait times
# out and the still is taken anyway. Tab-switch steps drive the real tabs
# via AppHelpers.getTranslation(TrKeys.*) finders - the same strings the
# tabs render - so they stay brand- and locale-neutral.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: delivery
imports:
  - "import 'package:base_sdk/src/services/app_helpers.dart';"
  - "import 'package:base_sdk/src/services/tr_keys.dart';"
steps:
  # Route first (no still), then wait for the map before the still: the
  # 2026-11-14 tour captured the home before the map had drawn its tiles
  # (the map mounts 800 ms after the page settles - DeferredMapSurface -
  # and the native view then needs a few seconds to fetch tiles).
  - key: driver_home_open
    title: "Your day on the map"
    action: route
    route: /home
    screenshot: false
    settle: 2
  - key: driver_home
    title: "Your day on the map"
    caption: "Go *online* and drive - your zone, your current delivery and your next job all live on one map."
    action: dart
    screenshot: true
    settle: 2
    dart: |
      // Up to 45s for the home's map-ready marker, polled every half
      // second. HomePage renders an empty SizedBox keyed
      // 'driver_home_map_ready' once GoogleMap's onMapCreated has fired
      // AND the map has gone idle on its first camera position
      // (google_maps_flutter has no tiles-loaded callback; first idle is
      // the closest signal). Matched by key string: no import needed.
      final Finder mapReady =
          find.byKey(const ValueKey<String>('driver_home_map_ready'));
      bool ready = false;
      for (int i = 0; i < 90; i++) {
        await tester.pump();
        if (mapReady.evaluate().isNotEmpty) {
          ready = true;
          break;
        }
        await Future<void>.delayed(const Duration(milliseconds: 500));
      }
      // Then 4s more for the tiles to download and fill the map area
      // (first idle can land while tiles are still streaming in). Skipped
      // when the marker never came, so a map-less run costs 45s, not more.
      if (ready) {
        for (int i = 0; i < 8; i++) {
          await tester.pump();
          await Future<void>.delayed(const Duration(milliseconds: 500));
        }
      }
      await tester.pump();
  - key: driver_orders
    title: "Deliveries in hand"
    caption: "Every delivery you have accepted, with the customer, the total and the *cash to collect* up front."
    action: route
    route: /orders
    settle: 8
  - key: driver_available_orders
    title: "The next job is waiting"
    caption: "Orders ready nearby - *grab the next job* with one tap. On the launcher: the shop, the drop and Accept, never the money."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      // The orders screen's second tab. The finder goes through the same
      // translated string the tab renders, so it resolves in any brand or
      // locale.
      await tester.tap(
        find.text(AppHelpers.getTranslation(TrKeys.availableOrders)).first,
        warnIfMissed: false,
      );
  - key: driver_route
    title: "Every stop, in order"
    caption: "Dispatch lines up your stops - pickups first, then drop-offs - with *distance and cash* per stop."
    action: route
    route: /driver-route
    settle: 8
  - key: driver_order_history
    title: "Proof of every drop"
    caption: "Your delivered orders stay on record - filter *any date range* when you need to look back."
    action: route
    route: /order-history
    settle: 8
  - key: driver_parcels
    title: "Parcels too"
    caption: "Documents and packages ride along - sender, receiver and fee on *every parcel*."
    action: route
    route: /parcels
    settle: 8
  - key: driver_available_parcels
    title: "Pick up a parcel"
    caption: "Parcels waiting nearby - *add one to your run* whenever it fits."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      // The parcels screen's second tab, found by its rendered translation.
      await tester.tap(
        find.text(AppHelpers.getTranslation(TrKeys.availableParcels)).first,
        warnIfMissed: false,
      );
  - key: driver_parcel_history
    title: "Parcel trail"
    caption: "Delivered parcels keep their own history, ready whenever you *need the paper trail*."
    action: route
    route: /parcel-history
    settle: 8
  - key: driver_deposits
    title: "Cash you owe, plain and simple"
    caption: "Your wallet balance and every *deposit* - approved, rejected or waiting - so you always know where the cash stands."
    action: route
    route: /driver-deposits
    settle: 8
  - key: driver_load
    title: "The van, by the numbers"
    caption: "The stock the shop handed you - *issued, sold, returned and left* on every line."
    action: route
    route: /load
    settle: 8
  - key: driver_load_sell
    title: "Sell at the door"
    caption: "Pick what the customer takes and *collect the cash* at the load price - the van updates itself."
    action: route
    route: /load/sell
    settle: 8
  - key: driver_load_return
    title: "Bring back what's left"
    caption: "Anything unsold goes back on the shop's books - *return it* before you close the load."
    action: route
    route: /load/return
    settle: 8
  # Navigation-only step (no still). It still routes the tour to /profile so
  # the courier chapter ends on the profile page (the next chapters open
  # from there in normal use), but the /profile STILL is owned by users_sdk's
  # fragment (step users_profile, Users/users/dart/templates/tour/
  # users.tour.yaml) whenever an app shell chains both fragments - paas_driver
  # tour/app.tour.yaml does. Two byte-identical captures under two captions
  # trip the assembler's duplicate-still gate (shared-workflows #486;
  # paas_driver guided-tour run 33952132288 failed with
  # "driver_profile == users_profile"). The caption this step used to carry,
  # kept for the record: "Your vehicle, your delivery zone and your *balance*
  # - all in one place."
  - key: driver_profile
    title: "You, your bike, your balance"
    action: route
    route: /profile
    screenshot: false
    settle: 8
