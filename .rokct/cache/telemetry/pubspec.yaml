name: telemetry_sdk
description: "Telemetry delivery-policy SDK - owns the TelemetryClient injection seam (base_sdk stays the only client)."
version: 1.1.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  get_it: ^8.0.0
  # TelemetrySpool: connectivity changes trigger a flush of the offline
  # queue, and DioException types tell a network failure (keep the event)
  # from a rejection. Same constraints as base_sdk, so the graph co-resolves.
  connectivity_plus: ^6.0.5
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  base_sdk:
    path: ../../../core/base/dart
