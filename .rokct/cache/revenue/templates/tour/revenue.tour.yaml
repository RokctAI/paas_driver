# Guided-tour fragment for revenue_sdk.
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns the one screen
# revenue_sdk installs per role: the income dashboard at /income
# (manifest.json app_type.driver -> DriverIncomeRoute, app_type.manager ->
# ManagerIncomeRoute — the same path in both composes, so this single step
# serves driver and manager shells alike; the caption is written to fit
# both a courier's earnings and a store's revenue).
#
# Assumes a signed-in session of the matching role (the shells' manifests
# sign in before this fragment runs); the screen is normally opened from
# the role's profile/home surface.
#
# Demo grounding: a demo session runs the real statistics repositories
# against the fixtures in templates/assets/demo/revenue (base_sdk's demo
# interceptor), which serve a fictional week of per-day figures offline so the tiles, chart and recent-order rows all render
# stocked.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: revenue
imports:
  - "import 'package:revenue_sdk/src/manager/presentation/revenue/profit_product_list.dart';"
steps:
  - key: revenue_income
    title: "Money at a glance"
    caption: "Today, this week or this month - *every rand earned*, charted day by day."
    action: route
    route: /income
    settle: 8
  - key: revenue_product_profit
    title: "Which products really earn"
    caption: "Tap a product for *its own profit* - revenue, margin and cost per variant - so you know what to push."
    action: dart
    settle: 6
    dart: |
      // The /income dashboard from the step above is still on screen. Bring
      // the first product row into view and tap it: a pushed detail page on
      // a phone, the detail plane where the dashboard has more than one.
      final Finder row = find.byType(ProductProfitRow);
      try {
        await tester.scrollUntilVisible(
          row.first,
          300,
          scrollable: find.byType(Scrollable).first,
        );
      } catch (_) {}
      if (row.evaluate().isNotEmpty) {
        await tester.tap(row.first, warnIfMissed: false);
      }
  - key: revenue_product_profit_close
    title: "Back to the dashboard"
    action: dart
    screenshot: false
    settle: 3
    dart: |
      // Tolerant: the phone's detail page is pushed above the dashboard;
      // on the planes spread nothing was pushed.
      final NavigatorState navigator =
          tester.state(find.byType(Navigator).first);
      if (find.byType(ProductProfitRow).evaluate().isEmpty &&
          navigator.canPop()) {
        navigator.pop();
      }
