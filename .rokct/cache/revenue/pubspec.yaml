name: revenue_sdk
description: "revenue_sdk - seller revenue/statistics, extracted from paas_manager (refork 2026-07-31)."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  auto_route: ^9.2.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  get_it: ^8.0.0
  intl: ^0.19.0
  pull_to_refresh: ^2.0.0
  # Icons of the approved dark language (same pin family as products_sdk
  # ^1.4.1 / paas_manager ^1.2.0).
  remixicon: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Widget tests host LocalStorage on the shared_preferences mock, the same
  # harness the sibling SDKs' tests use (screenutil is a main dependency).
  shared_preferences: ^2.2.0

dependency_overrides:
  http: ^1.2.0
  base_sdk:
    path: ../../../core/base/dart
