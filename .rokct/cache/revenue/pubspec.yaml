name: revenue_sdk
description: "revenue_sdk - seller revenue/statistics, extracted from paas_manager (refork 2026-07-31)."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  auto_route: ^9.2.0
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.0
  get_it: ^8.0.0
  intl: ^0.19.0
  pull_to_refresh: ^2.0.0
  # Icons of the approved dark language (same pin family as products_sdk
  # ^1.4.1 / paas_manager ^1.2.0).
  remixicon: ^1.2.0
  # The driver income template (templates/pages/driver/income/income_page.dart)
  # imports charts_flutter to build the earnings Series in the HOST package.
  # The host pubspec is generated from core/base/dart/templates/pubspec.yaml,
  # which does not carry it, so it is declared here and reaches every
  # composed driver host transitively. Same discontinued-upstream fork the
  # pre-fork paas_driver pinned; it requires intl ^0.20.2 (see the override
  # below). Medium-term: port the page to fl_chart and drop this.
  charts_flutter:
    git:
      url: https://github.com/Muhammadyunusxon/charts.git
      path: charts_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Widget tests host LocalStorage on the shared_preferences mock, the same
  # harness the sibling SDKs' tests use (screenutil is a main dependency).
  shared_preferences: ^2.2.0

dependency_overrides:
  http: ^1.2.0
  # charts_flutter / charts_common pin intl ^0.20.2 while base_sdk (and the
  # direct dependency above) declare ^0.19.0. The composed host already
  # arbitrates intl to ^0.20.2 in core/base/dart/templates/pubspec.yaml's
  # dependency_overrides, so this mirrors the host for standalone
  # resolution; the resolved intl is the one every composed build uses.
  intl: ^0.20.2
  base_sdk:
    path: ../../../core/base/dart
