# Guided-tour fragment for merchants_sdk (manager role).
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns only the screens
# merchants_sdk itself installs for app_type=manager composes: the manager
# home shell (/main, manifest.json app_type.manager) and the sync-issues
# screen (/sync-issues). Include it only in manager-family app manifests
# (paas_manager, pos, launch_manager) - those routes do not exist in other
# composes.
#
# Demo grounding (--dart-define=IS_DEMO=true): merchants_di.dart swaps in
# MockShopsRepository for the customer-facing ShopsRepositoryFacade, and
# since 1.22.0 ManagerMerchantsDependencies demo-gates the manager-side
# SellerShopRepositoryFacade to this SDK's own DemoSellerShopRepository -
# which serves MockShopsRepository.demoShop itself, so the shop a demo
# customer browses and the shop a demo manager runs are ONE shop. That is
# what makes the restaurant_hub step below a real capture rather than a
# blank header. The driver-role story screen (/story, app_type.driver) is
# out of scope - it belongs in a future driver-role fragment, since this
# fragment's /main route does not exist in driver composes.
#
# The sync-issues screen renders truthfully in demo: nothing is parked, so
# its own empty state ("no data") is the correct all-synced picture.
#
# POS steps (1.12.0, tour-sync rule: screen + fragment ship in the same
# PR): the till (BillingPage, tab 0) and the /pos-checkout flow ARE
# demo-grounded - ManagerMerchantsDependencies demo-gates the POS product
# lookup to this SDK's MockProductsRepository ("Demo Product", R150.00),
# and the checkout's connectivity probe fails closed to the offline-code
# flow in a headless harness - so every POS still below renders real
# widgets over real demo data with zero backend contact. The camera never
# mounts in demo builds; the viewfinder stage renders its camera-less
# stand-in (the approved strip's own render harness did the same).
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: merchants
imports:
  - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
  - "import 'package:merchants_sdk/src/manager/application/main/main_provider.dart';"
  - "import 'package:merchants_sdk/src/manager/application/pos_cart/pos_cart_provider.dart';"
steps:
  # Arrival/warm-up step: land the manager home shell (bottom navigation;
  # POS till preloaded on tab 0, the order queue on tab 1). No still is
  # captured here - the POS tab gets its own pos_scan still next, and the
  # queue tab's content is orders_sdk's to tour (see orders.tour.yaml).
  - key: manager_home
    title: "Open the manager home"
    action: route
    route: /main
    settle: 10
    screenshot: false
  - key: pos_scan
    title: "Sell straight from the camera"
    caption: "The till is the first thing a store owner sees - point it at any barcode and *every scan* lands the product in the cart, with torch and battery-saving auto-pause built in."
    action: dart
    settle: 8
    dart: |
      // Select the POS tab (index 0) explicitly - an earlier fragment may
      // have left another tab selected, and mainProvider's selection
      // persists across routes.
      router.replaceNamed('/main');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      container.read(mainProvider.notifier).selectIndex(0);
  - key: pos_cart
    title: "The cart keeps up"
    caption: "Steppers, decimal weights for loose goods, *live formatted totals* - and Clear All for when the customer changes their mind."
    action: dart
    settle: 6
    dart: |
      // Demo build: the barcode lane resolves through this SDK's
      // MockProductsRepository ("Demo Product", R150.00), zero backend
      // contact - the same path a real scan takes.
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      await container
          .read(posCartProvider.notifier)
          .addByBarcode('6001067890123');
      container.read(posCartProvider.notifier).increment(0);
  - key: pos_checkout
    title: "Cash, QR - or offline by code"
    caption: "Take cash or a pay-link QR the customer scans on their own phone; offline, *a 6-digit code* confirms it and the sale syncs itself later."
    action: route
    route: /pos-checkout
    settle: 8
  - key: restaurant_hub
    title: "Everything else, one tap away"
    caption: "The *restaurant hub* is the spine of the app - your shop's identity up top, and every setting, section and report a tap below it."
    action: dart
    settle: 8
    dart: |
      // Land the manager home shell and select the restaurant tab (index 4
      // since merchants_sdk 1.14.0 - POS till 0, order queue 1, kitchen 2,
      // foods 3) through the shell's own mainProvider, the same state the
      // bottom-navigation buttons drive. Route first: an earlier fragment
      // may have left the app elsewhere, and mainProvider's selection
      // persists across routes.
      //
      // The tab is preload: false in the shell's IndexedStack, so selecting
      // it is what first builds RestaurantPage - whose initState fetches
      // the shop through SellerShopRepositoryFacade. In demo builds that is
      // this SDK's DemoSellerShopRepository (see the demo-grounding note at
      // the top of this file), so the header renders with the demo shop's
      // name and rating rather than empty; the rows below it carry their
      // own isDemo subtitles. The settle covers that first fetch.
      router.replaceNamed('/main');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      container.read(mainProvider.notifier).selectIndex(4);
  - key: sync_issues
    title: "Nothing gets lost offline"
    caption: "Sell through any outage - offline work syncs back by itself, and anything that snags waits here with *retry or discard*."
    action: route
    route: /sync-issues
    settle: 6
