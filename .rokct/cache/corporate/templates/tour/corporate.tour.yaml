# Guided-tour fragment for corporate_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `corporate` (fragment file names must be unique across composed
# SDKs) and documents why there are no steps, so the merge's "SDK has not
# adopted guided tours" warning does not hide a real decision.
#
# corporate_sdk is a headless corporate/back-office data layer:
# manifest.json declares no installs and no routes, so there is no screen a
# tour step could ever capture. Its data surfaces inside the screens of the
# SDKs that display it, which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: corporate
steps: []
