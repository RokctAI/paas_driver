# Guided-tour fragment for loyalty_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `loyalty` (fragment file names must be unique across composed SDKs)
# and documents why there are no steps, so the merge's "SDK has not adopted
# guided tours" warning does not hide a real decision.
#
# loyalty_sdk is a headless loyalty data layer: manifest.json declares no
# installs and no routes, so there is no screen a tour step could ever
# capture. Loyalty balances surface inside the screens of the SDKs that
# display them, which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: loyalty
steps: []
