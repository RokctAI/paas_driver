name: kitchen_sdk
description: "Kitchen (prep station) domain models, picker providers, and the manager Kitchen screen."
version: 1.3.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  base_sdk:
    path: ../base
  flutter_remix: ^0.0.3
  flutter_riverpod: ^2.5.1
  get_it: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Widget tests host AppStyle text (sized with screenutil) and LocalStorage
  # (shared_preferences mock), the same harness orders_sdk's tests use.
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.2.0

# Workspace-relative override so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  http: ^1.2.0
  base_sdk:
    path: ../../../core/base/dart
