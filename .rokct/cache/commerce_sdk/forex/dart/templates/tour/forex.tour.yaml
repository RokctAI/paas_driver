# Guided-tour fragment for forex_sdk.
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns only the screens
# forex_sdk itself routes in manifest.json: the strategy catalogue
# (/forex-strategies), the risk presets (/forex-risk) and the account
# dashboard (/forex-account). All three route views are parameter-less.
#
# Demo grounding (--dart-define=IS_DEMO=true): ForexDependencies.register
# swaps HttpForexRepository for DemoForexRepository, whose fictional
# catalogue stocks the strategy list (one card deliberately tier-locked to
# show the honest locked treatment), the account snapshot and the risk
# profile offline. The four consumer-owned interfaces (ADR-005: access
# status, wallet balance, plan catalog, subscription status) keep their
# documented fail-closed resolvers even in demo builds.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: forex
steps:
  - key: forex_strategies
    title: "Strategies you can read"
    caption: "Browse every strategy in plain language - *what it does and who it's for*, before you commit."
    action: route
    route: /forex-strategies
    settle: 7
  - key: forex_risk
    title: "Risk, decided up front"
    caption: "Pick a risk preset and the limits are enforced for you - *your downside, capped* before any trade."
    action: route
    route: /forex-risk
    settle: 7
  - key: forex_account
    title: "Your account, live"
    caption: "Balance, equity, margin and open positions - *your whole account* on one screen."
    action: route
    route: /forex-account
    settle: 7
