# Guided-tour fragment for betassist_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `betassist` (fragment file names must be unique across composed SDKs)
# and documents why there are no steps, so the merge's "SDK has not adopted
# guided tours" warning does not hide a real decision.
#
# betassist_sdk ships embeddable widgets and services (AR scanner, card
# widgets, the onboarding flow, bet evaluation), not screens of its own:
# manifest.json installs only assets and declares no routes, so there is no
# screen a tour step could ever capture. Its widgets appear inside the
# embedding SDKs' screens, which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: betassist
steps: []
