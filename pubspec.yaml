  # Driver-app-specific packages, i.e. not provided by base_sdk's template.
  # Each is still referenced by app code that has not yet moved into an SDK;
  # when a feature moves, its package should move to that SDK's pubspec and
  # drop off this list.
  #   workmanager           - background location reporting (home_page.dart)
  #   percent_indicator     - push-order countdown ring (push_order_screen)
  #   map_launcher          - hand off to an external maps app (order_item)
  #   auto_size_text        - order list typography (orders_item.dart)
  #   calendar_date_picker2 - income date range (custom_date_picker.dart)
  #   charts_flutter        - income/statistics charts (income_page)
  workmanager: ^0.5.1
  percent_indicator: ^4.2.2
  calendar_date_picker2: ^1.1.5
  map_launcher: ^3.3.1
  auto_size_text: ^3.0.0
  charts_flutter:
    git:
      url: https://github.com/Muhammadyunusxon/charts.git
      path: charts_flutter

