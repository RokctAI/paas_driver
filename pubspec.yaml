  # demo build on the CI emulator for the marketing/tour screenshot pipeline.
  integration_test:
    sdk: flutter
  freezed: ^3.2.3
  build_runner: ^2.10.4
  flutter_lints: ^5.0.0
  # 9.x pins source_gen ^1.5/^2 which conflicts with freezed 3.x (source_gen
  # >=3); 10.3.x is the first line on analyzer 8 (10.4+ moves to auto_route
  # 11 / analyzer 10+, which drags freezed onto dev prereleases). Needs
  # auto_route 10.x at
  # runtime - arbitrated in dependency_overrides below.
  auto_route_generator: '>=10.3.1 <10.4.0'
  flutter_launcher_icons: ^0.14.1
  cupertino_icons: ^1.0.6

