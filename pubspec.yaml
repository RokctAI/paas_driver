# Feature SDK pubspecs point at ../base (the composed-app cache layout).
# When paas_customer itself is the resolution root against sibling repos,
# this override redirects base_sdk to its real workspace location.
# Version arbitration across the composed SDK set (kernel pins an older
# ecosystem than the newest SDKs; root overrides win globally).
dependency_overrides:
  get_it: ^8.0.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  # 6.3.0 fails const evaluation of its FontWeight variant map on current
  # Flutter ("The key 'FontWeight {value: 100}' does not have a primitive
  # operator '=='"); 6.3.3 fixes it. Matches base_sdk's ^6.3.3 pin and what
  # supacharge (no committed lock) resolves on the same Flutter.
  google_fonts: ^6.3.3
  http: ^1.2.0
  # auto_route_generator 10.3.x (required by the freezed 3.x / source_gen 3
  # toolchain) needs auto_route 10.x, while the composed SDKs still pin
  # ^9.2.0. 10.1+ keeps the renamed 9.x APIs (e.g. replaceNamed) as deprecated
  # aliases, so composed source compiles unchanged. Follow-up: bump the SDK
  # auto_route pins, then this override can go.
  auto_route: ^10.3.0
  # drift must stay on a release whose sqlite3 constraint admits the pinned
  # sqlite3 2.9.4 below (2.34.x moved to sqlite3 ^3.x and fails to compile
  # against it). Mirrors paas_manager's and supacharge's arbitration of the
  # same conflict.
  drift: 2.31.0
  sqlite3: 2.9.4
  # workmanager must land on the v2-embedding rewrite (>=0.6): 0.5.x's Kotlin
  # references the Flutter v1 shim, which Flutter 3.29+ deleted, so
  # :workmanager:compileReleaseKotlin fails (Unresolved reference 'shim' /
  # 'ShimPluginRegistry'). The composed delivery_sdk cache may still pin
  # ^0.5.1 until its next compose picks up the zones-side bump; this override
  # keeps resolution on 0.10.x regardless of cache staleness.
  workmanager: ^0.10.7
  # Firebase pinned exactly, mirroring supacharge: with only caret floors,
  # pub get drifts firebase_core to 3.15.x (bundled Firebase C++ SDK 12.7.0)
  # while cloud_firestore stays on the 5.4.x era, and that mixed set is
  # statically linked into the Windows exe — the app then dies silently at
  # native plugin registration on startup. Keep the whole FlutterFire set on
  # the known-good 3.10.0-era (Firebase C++ 12.0.0) versions; bump them only
  # together, as one coherent set.
  firebase_core: 3.10.0
  firebase_auth: 5.4.0
  firebase_messaging: 15.1.0
  firebase_remote_config: 5.1.3
  firebase_dynamic_links: 6.0.5
  cloud_firestore: 5.4.0
  # html 0.15.7 (published 2026-08-28) removed the private query_selector matches()
  # that flutter_html 3.0.0 imports; pin until flutter_html ships a compatible release.
  html: 0.15.6
