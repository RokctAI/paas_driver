  # Template-host packages. The features that use these have finished their
  # move into SDK repos, but SDK templates are installed into the generated
  # lib/ at compose time and compile against THIS pubspec, so the entries stay
  # here by design (delivery_sdk's manifest documents them as host deps its
  # templates additionally need).
  #   workmanager           - delivery_sdk: courier_location_service lib code
  #                           + home_page template (also in its own pubspec)
  #   percent_indicator     - delivery_sdk: push-order countdown ring template
  #   map_launcher          - delivery_sdk: external-maps handoff templates
  #   auto_size_text        - delivery_sdk: order list typography templates
  #   calendar_date_picker2 - base_sdk dep; delivery_sdk custom_date_picker
  #                           template
  #   charts_flutter        - revenue_sdk income template builds its chart
  #                           Series host-side: revenue_sdk deliberately stays
  #                           chart-library-agnostic, so the host owns this dep
  # workmanager >=0.6 is the v2-embedding rewrite; 0.5.x still references the
  # deleted Flutter v1 shim (ShimPluginRegistry/PluginRegistrantCallback) and
  # fails :workmanager:compileReleaseKotlin on Flutter 3.29+.
  workmanager: ^0.10.7
  percent_indicator: ^4.2.2
  calendar_date_picker2: ^1.1.5
  map_launcher: ^3.3.1
  auto_size_text: ^3.0.0
  charts_flutter:
    git:
      url: https://github.com/Muhammadyunusxon/charts.git
      path: charts_flutter

