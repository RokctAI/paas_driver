# Guided-tour manifest for the Driver app shell (paas_driver).
#
# This file is the ONLY place the tour carries Driver branding: SDK tour
# fragments (each SDK's templates/tour/<sdk>.tour.yaml) stay brand-neutral
# and receive {app_name}/{app_tagline} by substitution at merge time.
# The merge, capture and assembly all run in CI via
# RokctAI/shared-workflows .github/workflows/universal-guided-tour.yml;
# format documentation lives in that repo at scripts/tour/README.md.
#
# Demo account: setup.demo_email below is substituted into auth_sdk's
# shared fragment, so its demo sign-in signs straight in as
# driver@demo.rokct.ai - in demo builds MockAuthRepository maps that email
# to the deliveryman role, which Driver's session policy (delivery_sdk
# manifest, app_type.driver) lands on /home, exactly where the delivery
# fragment starts. Left unset, the fragment falls back to
# demo.student@example.com, which maps to 'customer'; that role is not
# rejected here - the policy's '*' fallback admits it - but it lands on
# /become-driver, the recruitment funnel, so the tour would film the wrong
# app.
#
# There is deliberately NO second sign-in after the auth fragment: the
# demo sign-in above already lands on /home (see the note where the
# sign_out_customer + driver_sign_in steps used to sit).
#
# Fragment order mirrors the composed SDKs that ship fragments today
# (composer profile: The-Rokct-Protocol core/utils/flutter/composer/
# driver.json): auth (Users/auth), delivery (zones/delivery), zones
# (zones/zones - the /delivery-zone editor), revenue (corporate/revenue -
# the /income earnings dashboard), calc (productivity/calc - the /calc
# calculator), users (Users/users - /profile resolves here via
# delivery_sdk's ProfileRoute).
# Other composed SDKs (orders, merchants, products: manager-role screens
# only; comms, weather, map: headless in the driver compose; base: its
# status screens are toured by the minilauncher shell) ship no driver-role
# fragment chained here - coverage grows with the SDKs.
#
# Video colours are intentionally NOT declared here: the assembler derives
# brand/accent colours from the composed AppStyle when the manifest carries
# no colour keys, so the video always matches the app's real theme.
#
# Outputs land in marketing/tour/ (screenshots + feature-guide.md required,
# per-chapter videos best-effort).
app:
  name: Driver
  tagline: Deliveries, parcels and payouts in one app
  # Committed app logo (transparent background), shown on the video end card.
  logo: assets/images/logo.png
video:
  hook: "Your next delivery is already waiting."
  offer: "Go online and start earning."
  # The auth chapter's key content is bottom sheets, so its phone hangs
  # top-cropped from the top canvas edge (keeping the sheet fully
  # visible); every other chapter keeps the default bottom-cropped
  # WhatsApp-ad framing.
  chapter_frame_anchor:
    auth: top
store:
  # Play feature graphic: the hero screenshot is the app's HOME step
  # (the courier /home screen the delivery fragment opens on).
  feature_step: driver_home
setup:
  # Account auth_sdk's shared tour fragment signs in as ({demo_email} in
  # that fragment). Driver needs the deliveryman role - see header note.
  demo_email: driver@demo.rokct.ai
  imports:
    - "import 'package:base_sdk/src/models/response/languages_response.dart';"
    - "import 'package:base_sdk/src/services/local_storage.dart';"
  dart: |
    // Pre-seed the language so the first-run language picker can never
    // block the tour behind a non-dismissible modal (the backend may
    // advertise several languages). LocalStorage.init() is idempotent -
    // app.main() calls it again.
    await LocalStorage.init();
    if (LocalStorage.getLanguage() == null) {
      await LocalStorage.setLanguageData(LanguageData(
        id: '1',
        title: 'English',
        locale: 'en',
        backward: false,
        isDefault: true,
        active: true,
      ));
      await LocalStorage.setLanguageSelected(true);
      await LocalStorage.setLangLtr(false);
    }
tour:
  # Splash settles onto the sign-in screen (demo builds show the demo hint).
  - step:
      key: welcome
      title: "Welcome to Driver"
      caption: "{app_name} puts *your whole delivery day* in one app - sign in to get started."
      action: wait
      settle: 12
  # auth_sdk captures the auth screens, then performs its demo sign-in
  # (action only, no still) as setup.demo_email - the courier - so the
  # session policy lands it straight on /home.
  - fragment: auth
  # The sign_out_customer + driver_sign_in steps that used to follow here
  # were a redundant second sign-in (demo_sign_in already lands on /home as
  # driver@demo.rokct.ai). Signing out disposed HomePage's Google map while
  # the plugin's own updateTileOverlays call was in flight, which killed the
  # phone leg 4/17 in run 34049256577 (channel-error) - so they are gone.
  # Chapter 1 - the courier day: delivery_sdk owns the driver screens and
  # the Demo* courier repositories behind them.
  - fragment: delivery
  # Chapter 2 - the territory: zones_sdk's delivery-zone editor
  # (/delivery-zone, opened from the courier profile in normal use - the
  # delivery chapter's last step lands on /profile right before this). In
  # demo builds DemoDriverDeliveryZonesRepository draws the same zone
  # square the home map shows.
  - fragment: zones
  # Chapter 3 - the money: revenue_sdk's /income dashboard (app_type.driver
  # DriverIncomeRoute - opened from the courier profile in normal use). In
  # demo builds DemoCourierStatisticsRepository serves a fictional week of
  # earnings so the tiles, chart and order rows render stocked.
  - fragment: revenue
  # Chapter 4 - the pocket calculator: calc_sdk's /calc (composed on driver
  # and manager alike per Ray's decision recorded in its manifest).
  - fragment: calc
  # Chapter 5 - the account: users_sdk's profile surface (delivery_sdk's
  # ProfileRoute serves /profile in this compose, so the fragment's
  # tolerant navigation resolves).
  - fragment: users
