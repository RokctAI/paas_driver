# Guided-tour manifest for the Driver app shell (paas_driver).
#
# This file is the ONLY place the tour carries Driver branding: SDK tour
# fragments (each SDK's templates/tour/<sdk>.tour.yaml) stay brand-neutral
# and receive {app_name}/{app_tagline} by substitution at merge time.
# The merge, capture and assembly all run in CI via
# RokctAI/shared-workflows .github/workflows/universal-guided-tour.yml;
# format documentation lives in that repo at scripts/tour/README.md.
#
# Role chaining: auth_sdk's fragment ends with its generic demo sign-in
# (demo.student@example.com). Driver's session policy (delivery_sdk
# manifest, app_type.driver) admits any role through its '*' fallback and
# lands non-couriers on /become-driver, so that session is signed out and
# the tour signs back in as driver@demo.rokct.ai - in demo builds
# MockAuthRepository maps that email to the deliveryman role, which the
# policy lands on /home, exactly where the delivery fragment starts.
#
# Fragment order mirrors the composed SDKs that ship fragments today
# (composer profile: The-Rokct-Protocol core/utils/flutter/composer/
# driver.json): auth (Users/auth), delivery (zones/delivery), users
# (Users/users - /profile resolves here via delivery_sdk's ProfileRoute).
# Other composed SDKs (orders, merchants, products: manager-role screens
# only; comms, zones, weather, ...) ship no driver-role fragment yet and
# would be skipped with a warning if listed - coverage grows with the SDKs.
#
# Video colours are intentionally NOT declared here: the assembler derives
# brand/accent colours from the composed AppStyle when the manifest carries
# no colour keys, so the video always matches the app's real theme.
#
# Outputs land in marketing/tour/ (screenshots + feature-guide.md required,
# per-chapter videos best-effort).
app:
  name: Driver
  tagline: Deliveries, parcels and payouts in one app
  # Committed app logo (transparent background), shown on the video end card.
  logo: assets/images/logo.png
video:
  hook: "Your next delivery is already waiting."
  offer: "Go online and start earning."
  # The auth chapter's key content is bottom sheets, so its phone hangs
  # top-cropped from the top canvas edge (keeping the sheet fully
  # visible); every other chapter keeps the default bottom-cropped
  # WhatsApp-ad framing.
  chapter_frame_anchor:
    auth: top
store:
  # Play feature graphic: the hero screenshot is the app's HOME step
  # (the courier /home screen the delivery fragment opens on).
  feature_step: driver_home
setup:
  imports:
    - "import 'package:base_sdk/src/models/response/languages_response.dart';"
    - "import 'package:base_sdk/src/services/local_storage.dart';"
  dart: |
    // Pre-seed the language so the first-run language picker can never
    // block the tour behind a non-dismissible modal (the backend may
    // advertise several languages). LocalStorage.init() is idempotent -
    // app.main() calls it again.
    await LocalStorage.init();
    if (LocalStorage.getLanguage() == null) {
      await LocalStorage.setLanguageData(LanguageData(
        id: '1',
        title: 'English',
        locale: 'en',
        backward: false,
        isDefault: true,
        active: true,
      ));
      await LocalStorage.setLanguageSelected(true);
      await LocalStorage.setLangLtr(false);
    }
tour:
  # Splash settles onto the sign-in screen (demo builds show the demo hint).
  - step:
      key: welcome
      title: "Welcome to Driver"
      caption: "{app_name} puts *your whole delivery day* in one app - sign in to get started."
      action: wait
      settle: 12
  # auth_sdk captures the auth screens, then performs its generic demo
  # sign-in (action only, no still); driver's '*' fallback admits that
  # account and lands it on /become-driver with a live session.
  - fragment: auth
  # --- chaining: generic demo account -> courier ------------------------
  # End the fallback session and return to the login screen. LocalStorage
  # .logout() is base_sdk's static session teardown (the same call the
  # app's own sign-out uses).
  - step:
      key: sign_out_customer
      title: "Sign out"
      action: dart
      screenshot: false
      settle: 4
      dart: |
        LocalStorage.logout();
        router.replaceNamed('/login');
  # Sign in as the demo courier through the same login flow the auth
  # fragment's demo_sign_in uses; MockAuthRepository maps this email to
  # the deliveryman role, and the driver session policy lands it on
  # /home - the delivery fragment's first step routes there explicitly,
  # so only a modest settle is needed here.
  - step:
      key: driver_sign_in
      title: "Sign in (courier)"
      action: dart
      screenshot: false
      settle: 6
      dart: |
        final Element element = tester.element(find.byType(Navigator).first);
        final ProviderContainer container =
            ProviderScope.containerOf(element, listen: false);
        // loginProvider is autoDispose: hold a subscription so the notifier
        // survives between the field writes and the login call.
        final ProviderSubscription<dynamic> subscription =
            container.listen(loginProvider, (_, __) {});
        try {
          final login = container.read(loginProvider.notifier);
          login.setEmail('driver@demo.rokct.ai');
          login.setPassword('demo-drivers-2026');
          // MockAuthRepository accepts any credentials. The timeout guards the
          // post-session FCM sync, which can stall on an emulator - navigation
          // to the demo landing happens before it, so a timeout is harmless.
          await login
              .login(element)
              .timeout(const Duration(seconds: 45), onTimeout: () {});
        } finally {
          subscription.close();
        }
  # Chapter 1 - the courier day: delivery_sdk owns the driver screens and
  # the Demo* courier repositories behind them.
  - fragment: delivery
  # Chapter 2 - the account: users_sdk's profile surface (delivery_sdk's
  # ProfileRoute serves /profile in this compose, so the fragment's
  # tolerant navigation resolves).
  - fragment: users
